<body>
  <div id="nav-bar" class="config-panel">
	  <div id="config" onclick="toggleSettings(this)"></div>
	  <h2 class="llfont">Settings</h2>
    <footer>
		  <span class="llfont">&copy; 2026 ShioShioppi (SHIO-P)</span>
	  </footer>
  </div>

  <div id='background-primary' style="display: block"></div>
  <div id='background-hidden' style="display: none"></div>

  <div id='main-container'>
    <img class="event-title" src="images/Sprites/flyer-title-new.png" data-target="/events/school-idol-bunkasai-2026" onclick="goToPage(this)" draggable="false"/>

      <div class="flyer-component" id="performers-list">
        <ul class="flyer-list-items">
          <li class="llfont flyer-text-item interactable" data-x data-target="mezy2_">mezy</li>
          <li class="llfont flyer-text-item interactable" data-x data-target="ShioShioppi">SHIO-P</li>
          <li class="llfont flyer-text-item interactable" data-x data-target="seirent_127">みのり</li>
          <li class="llfont flyer-text-item interactable" data-x data-target="Atsushio">アツシオハラ</li>
          <li class="llfont flyer-text-item interactable" data-x data-target="QiSD09tek">Gren</li>
          <li class="llfont flyer-text-item interactable" data-x data-target="syino12">しぃの</li>
        </ul>
      </div>
      <div class="flyer-component" id="vj-list">
        <ul class="flyer-list-items">
          <li class="llfont flyer-text-item interactable" data-x data-target="nagatea_p">nagatea</li>
          <li class="llfont flyer-text-item interactable" data-x data-target="junjun_lovers_x">JUNJUN</li>
        </ul>
      </div>
      <div class="flyer-component" id="location">
        <span class="llfont flyer-text-item interactable" data-target="https://maps.app.goo.gl/Bzxm1VtHLds4MbAK9" draggable="false">
          <span>秋葉原雷神2F</span>
          <br>
          <span class="flyer-item-sub-header">Anison DJ Cafe Bar RAIJIN 2F</span>
        </span>
      </div>
      <div class="flyer-component" id="rules">
        <span class="llfont flyer-text-item">
          <span>ラブライブシリーズ<br>楽曲8割超！</span>
          <br>
          <span class="flyer-item-sub-header">Over 80% songs will be Love<br>Live songs!</span>
        </span>
      </div>
      <div class="flyer-component interactable" id="twipla" data-target="https://twipla.jp/events/747293" data-child>
          <img src="images/Sprites/twipla-revamp.png" draggable="false">
      </div>
    </div>
